name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch raw export
        run: npm run fetch-data
      - name: Check whether data changed since last deploy
        id: changed
        run: |
          live=$(curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/meta.json" | node -pe "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));m.md5+(m.progressMd5||'')" || echo none)
          new=$(node -pe "const m=require('./public/data/meta.json');m.md5+(m.progressMd5||'')")
          if [ "$live" = "$new" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm run build
        if: steps.changed.outputs.skip != 'true'
      - uses: actions/configure-pages@v6
        if: steps.changed.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.changed.outputs.skip != 'true'
        with:
          path: dist
      - id: deployment
        if: steps.changed.outputs.skip != 'true'
        uses: actions/deploy-pages@v5
